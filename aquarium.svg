<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 160" width="100%" height="160" role="img" aria-labelledby="title desc" style="border-radius:12px;overflow:hidden;display:block">
  <title id="title">SKY Living Code Reef</title>
  <desc id="desc">A colorful animated underwater reef with fish, shark, manta ray, jellyfish, bubbles, coral and swaying sea plants.</desc>

  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#031d5f"/>
      <stop offset="38%" stop-color="#046fa8"/>
      <stop offset="72%" stop-color="#0798bc"/>
      <stop offset="100%" stop-color="#02b7c9"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#062d62"/>
      <stop offset="48%" stop-color="#064d6c"/>
      <stop offset="100%" stop-color="#053359"/>
    </linearGradient>
    <linearGradient id="shark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8fb5c9"/>
      <stop offset="100%" stop-color="#d8edf4"/>
    </linearGradient>
    <linearGradient id="manta" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#163d66"/>
      <stop offset="100%" stop-color="#071b36"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

