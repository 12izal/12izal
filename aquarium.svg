<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260" role="img" aria-labelledby="title desc">
  <title id="title">SKY Coding Aquarium</title>
  <desc id="desc">An animated underwater aquarium with fish, shark, whale, bubbles and waving plants in SKY blue tones.</desc>

  <defs>
    <linearGradient id="ocean" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#031a3a"/>
      <stop offset="42%" stop-color="#053b73"/>
      <stop offset="100%" stop-color="#07172f"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0a3556"/>
      <stop offset="50%" stop-color="#0f5273"/>
      <stop offset="100%" stop-color="#092d4c"/>
    </linearGradient>
    <linearGradient id="skyGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2f81f7"/>
      <stop offset="55%" stop-color="#38d7ff"/>
      <stop offset="100%" stop-color="#f4b942"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="rounded"><rect x="2" y="2" width="996" height="256" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <rect width="1000" height="260" fill="url(#ocean)"/>

    <!-- light rays -->
    <path d="M80 0 L235 210 L320 210 L170 0Z" fill="#4cc9ff" opacity="0.05"/>
    <path d="M510 0 L570 205 L650 205 L605 0Z" fill="#7ee7ff" opacity="0.045"/>
    <path d="M800 0 L775 195 L850 195 L890 0Z" fill="#7ee7ff" opacity="0.04"/>

    <!-- title -->
    <g filter="url(#glow)">
      <text x="500" y="43" text-anchor="middle" font-family="Verdana,Segoe UI,sans-serif" font-size="20" font-weight="700" fill="#dff8ff" letter-spacing="2">DEEP IN THE CODEBASE</text>
      <rect x="405" y="54" width="190" height="3" rx="2" fill="url(#skyGlow)" opacity="0.9"/>
    </g>

    <!-- tiny particles -->
    <g fill="#b9f5ff" opacity="0.45">
      <circle cx="85" cy="78" r="1.4"><animate attributeName="cy" values="78;20;78" dur="8s" repeatCount="indefinite"/></circle>
      <circle cx="215" cy="115" r="1.2"><animate attributeName="cy" values="115;42;115" dur="10s" repeatCount="indefinite"/></circle>
      <circle cx="720" cy="90" r="1.3"><animate attributeName="cy" values="90;25;90" dur="9s" repeatCount="indefinite"/></circle>
      <circle cx="915" cy="125" r="1.1"><animate attributeName="cy" values="125;48;125" dur="11s" repeatCount="indefinite"/></circle>
    </g>

    <!-- whale -->
    <g transform="translate(-190 74)">
      <g>
        <ellipse cx="70" cy="30" rx="56" ry="23" fill="#244f7e"/>
        <path d="M22 25 C2 12,-8 15,-20 28 C-8 30,2 39,22 34Z" fill="#244f7e"/>
        <path d="M118 28 C142 13,151 14,166 29 C149 31,141 38,119 35Z" fill="#1f456f"/>
        <path d="M64 47 C66 58,82 58,89 47" fill="none" stroke="#78dfff" stroke-width="3" stroke-linecap="round"/>
        <circle cx="90" cy="24" r="3" fill="#c9f7ff"/>
        <path d="M54 8 C50 -3,61 -8,69 0 C73 -9,85 -7,85 3" fill="none" stroke="#77e8ff" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
        <animateTransform attributeName="transform" type="translate" values="0 0;1180 8" dur="24s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- shark -->
    <g transform="translate(1050 92)">
      <g>
        <path d="M0 24 C30 0,100 2,137 24 C102 50,37 48,0 29Z" fill="#7e9db7"/>
        <path d="M58 5 L78 -20 L90 7Z" fill="#6e8da6"/>
        <path d="M20 24 L-22 2 L-14 25 L-24 47Z" fill="#6e8da6"/>
        <path d="M80 39 L96 55 L101 36Z" fill="#66859e"/>
        <circle cx="111" cy="19" r="3.1" fill="#061321"/>
        <path d="M111 33 Q122 39 131 31" fill="none" stroke="#29465e" stroke-width="2"/>
        <animateTransform attributeName="transform" type="translate" values="0 0;-1230 5" dur="17s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- yellow fish -->
    <g transform="translate(-80 126)">
      <g>
        <ellipse cx="24" cy="14" rx="24" ry="13" fill="#f5b942"/>
        <path d="M3 14 L-17 2 L-17 26Z" fill="#ffcf5c"/>
        <path d="M25 2 L34 -9 L38 5Z" fill="#ffcf5c"/>
        <circle cx="38" cy="11" r="2.4" fill="#07172f"/>
        <animateTransform attributeName="transform" type="translate" values="0 0;1130 10" dur="13s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- cyan fish -->
    <g transform="translate(1080 148)">
      <g>
        <ellipse cx="25" cy="13" rx="25" ry="13" fill="#32d6ff"/>
        <path d="M5 13 L-17 1 L-17 25Z" fill="#2f81f7"/>
        <path d="M26 2 L36 -9 L39 5Z" fill="#65e6ff"/>
        <circle cx="40" cy="10" r="2.4" fill="#061321"/>
        <animateTransform attributeName="transform" type="translate" values="0 0;-1180 -8" dur="11s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- small school -->
    <g fill="#8eeeff" opacity="0.92">
      <g transform="translate(-90 98)">
        <path d="M0 7 Q14 -2 28 7 Q14 16 0 7 M0 7 L-10 0 L-10 14Z"/>
        <animateTransform attributeName="transform" type="translate" values="0 0;1200 24" dur="19s" repeatCount="indefinite"/>
      </g>
      <g transform="translate(-160 112) scale(.8)">
        <path d="M0 7 Q14 -2 28 7 Q14 16 0 7 M0 7 L-10 0 L-10 14Z"/>
        <animateTransform attributeName="transform" type="translate" values="0 0;1280 -16" dur="20s" repeatCount="indefinite"/>
      </g>
      <g transform="translate(-230 87) scale(.65)">
        <path d="M0 7 Q14 -2 28 7 Q14 16 0 7 M0 7 L-10 0 L-10 14Z"/>
        <animateTransform attributeName="transform" type="translate" values="0 0;1360 10" dur="21s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- bubbles -->
    <g fill="none" stroke="#7ee7ff" stroke-width="1.5" opacity="0.7">
      <circle cx="130" cy="218" r="4"><animate attributeName="cy" values="218;68" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.8;0" dur="7s" repeatCount="indefinite"/></circle>
      <circle cx="148" cy="232" r="2.6"><animate attributeName="cy" values="232;80" dur="6s" begin="1.1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.7;0" dur="6s" begin="1.1s" repeatCount="indefinite"/></circle>
      <circle cx="690" cy="225" r="3.5"><animate attributeName="cy" values="225;82" dur="8s" begin=".4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.8;0" dur="8s" begin=".4s" repeatCount="indefinite"/></circle>
      <circle cx="710" cy="238" r="2.2"><animate attributeName="cy" values="238;92" dur="6.6s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.75;0" dur="6.6s" begin="2s" repeatCount="indefinite"/></circle>
      <circle cx="846" cy="220" r="4.2"><animate attributeName="cy" values="220;65" dur="7.8s" begin="1.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.8;0" dur="7.8s" begin="1.4s" repeatCount="indefinite"/></circle>
    </g>

    <!-- seabed -->
    <path d="M0 220 C140 202,205 229,330 214 C460 198,560 230,690 213 C805 199,895 224,1000 210 L1000 260 L0 260Z" fill="url(#sand)"/>
    <g fill="#183f61" opacity="0.8">
      <ellipse cx="110" cy="238" rx="18" ry="7"/><ellipse cx="390" cy="244" rx="24" ry="8"/><ellipse cx="770" cy="237" rx="20" ry="7"/><ellipse cx="910" cy="248" rx="25" ry="8"/>
    </g>

    <!-- coral left -->
    <g transform="translate(42 205)">
      <path d="M0 38 C2 20,2 10,8 0 C11 12,9 20,15 28 C18 15,22 10,26 5 C27 20,22 29,29 38Z" fill="#ff5f88"/>
      <path d="M30 38 C29 20,35 12,39 2 C45 17,40 27,48 38Z" fill="#f68b49"/>
    </g>

    <!-- plants with sway -->
    <g fill="none" stroke-linecap="round">
      <path d="M165 245 Q145 215 165 177" stroke="#19c99a" stroke-width="8"><animate attributeName="d" values="M165 245 Q145 215 165 177;M165 245 Q185 215 165 177;M165 245 Q145 215 165 177" dur="4.8s" repeatCount="indefinite"/></path>
      <path d="M190 246 Q215 215 194 185" stroke="#26e0b0" stroke-width="7"><animate attributeName="d" values="M190 246 Q215 215 194 185;M190 246 Q169 215 194 185;M190 246 Q215 215 194 185" dur="5.6s" repeatCount="indefinite"/></path>
      <path d="M596 244 Q570 210 594 171" stroke="#16b985" stroke-width="9"><animate attributeName="d" values="M596 244 Q570 210 594 171;M596 244 Q622 210 594 171;M596 244 Q570 210 594 171" dur="5.1s" repeatCount="indefinite"/></path>
      <path d="M625 246 Q650 215 632 182" stroke="#2bd6a8" stroke-width="7"><animate attributeName="d" values="M625 246 Q650 215 632 182;M625 246 Q604 215 632 182;M625 246 Q650 215 632 182" dur="4.4s" repeatCount="indefinite"/></path>
      <path d="M948 246 Q925 211 946 176" stroke="#19c99a" stroke-width="8"><animate attributeName="d" values="M948 246 Q925 211 946 176;M948 246 Q969 211 946 176;M948 246 Q925 211 946 176" dur="5.3s" repeatCount="indefinite"/></path>
    </g>

    <!-- code shells -->
    <g font-family="monospace" font-size="12" font-weight="700" opacity="0.8">
      <text x="280" y="238" fill="#38d7ff">&lt;/&gt;</text>
      <text x="486" y="246" fill="#f4b942">{ }</text>
      <text x="842" y="235" fill="#7ee7ff">0101</text>
    </g>

    <!-- SKY badge -->
    <g transform="translate(430 204)">
      <rect width="140" height="34" rx="17" fill="#061e3d" stroke="#2f81f7" stroke-width="1.5" opacity="0.94"/>
      <text x="70" y="22" text-anchor="middle" font-family="Verdana,Segoe UI,sans-serif" font-size="14" font-weight="700" fill="#e8fbff" letter-spacing="1.2">SKY • 12izal</text>
    </g>
  </g>

  <rect x="2" y="2" width="996" height="256" rx="20" fill="none" stroke="#1f6feb" stroke-width="2" opacity="0.55"/>
</svg>