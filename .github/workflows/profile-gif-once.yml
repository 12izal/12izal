name: Finalize Looping Profile GIF

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/profile-gif-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure ffmpeg is available
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1

      - name: Download source video
        run: |
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://github.com/user-attachments/assets/793e80f4-a94e-43c2-a737-0576222fcd12' \
            -o /tmp/profile.mp4
          test -s /tmp/profile.mp4

      - name: Convert video to infinite-loop GIF
        run: |
          ffmpeg -y -i /tmp/profile.mp4 \
            -filter_complex "fps=8,scale=200:-1:flags=lanczos,split[s0][s1];[s0]palettegen[p];[s1][p]paletteuse" \
            -loop 0 profile-loop.gif
          test -s profile-loop.gif
          ls -lh profile-loop.gif

      - name: Write clean profile README
        run: |
          cat > README.md <<'EOF'
          <div align="center">
            <img src="https://raw.githubusercontent.com/12izal/12izal/main/profile-loop.gif?v=2" width="240" alt="Profile animation" />
          </div>

          <br/>

          ## Network Contribution Map

          <div align="center">
            <img src="https://raw.githubusercontent.com/12izal/12izal/output/github-contribution-grid-snake-dark.svg?v=3" width="90%" alt="Snake Contribution Stream" />
          </div>

          <br/><br/>

          <div align="center">
            <img src="https://raw.githubusercontent.com/12izal/12izal/main/aquarium.svg" width="100%" alt="SKY Coding Aquarium" />
          </div>
          EOF

      - name: Remove temporary generator workflows
        run: |
          rm -f .github/workflows/profile-gif.yml
          rm -f .github/workflows/profile-gif-once.yml

      - name: Commit profile GIF and README
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A profile-loop.gif README.md .github/workflows
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git commit -m 'Add centered looping profile GIF'
          git pull --rebase origin main
          git push origin HEAD:main
