name: Generate Snake Animation

# Retry marker: 2026-08-08
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate SNAKE_TOKEN safely
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SNAKE_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::SNAKE_TOKEN is empty. Add the token VALUE in Settings > Secrets and variables > Actions."
            exit 1
          fi

          status=$(curl -sS -o /tmp/github-user.json -w "%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/user)

          if [ "$status" != "200" ]; then
            echo "::error::SNAKE_TOKEN is not accepted by GitHub (HTTP $status). Update the repository secret with a valid PAT value."
            exit 1
          fi

          echo "SNAKE_TOKEN is valid."

      - name: Generate premium neon contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.SNAKE_TOKEN }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#00F7FF&color_dots=#161233,#302b63,#6e40c9,#00f7ff,#ffffff
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#00F7FF&color_dots=#161233,#302b63,#6e40c9,#00f7ff,#ffffff

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
