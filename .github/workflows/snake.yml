name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate premium neon contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#00F7FF&color_dots=#161233,#302b63,#6e40c9,#00f7ff,#ffffff
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#00F7FF&color_dots=#161233,#302b63,#6e40c9,#00f7ff,#ffffff

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  profile-gif:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure ffmpeg is available
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Download source video
        run: |
          curl -L --fail --retry 3 \
            "https://github.com/user-attachments/assets/793e80f4-a94e-43c2-a737-0576222fcd12" \
            -o /tmp/profile-source.mp4

      - name: Generate centered looping profile GIF
        run: |
          ffmpeg -y -i /tmp/profile-source.mp4 \
            -vf "fps=8,scale=220:-1:flags=lanczos,palettegen=max_colors=96" \
            -frames:v 1 -update 1 /tmp/profile-palette.png

          ffmpeg -y -i /tmp/profile-source.mp4 -i /tmp/profile-palette.png \
            -lavfi "fps=8,scale=220:-1:flags=lanczos[x];[x][1:v]paletteuse=dither=bayer:bayer_scale=4" \
            -loop 0 profile-loop.gif

      - name: Commit GIF to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add profile-loop.gif
          if git diff --cached --quiet; then
            echo "GIF unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "Generate looping profile GIF"
          git push origin HEAD:main
